<body>
    <main>
        <div class="passo" id="passo-0">
            <p>No porão da Estação da Luz, você analisa o diário. Para avançar na busca pela cidade perdida sob São Paulo, decida seu primeiro destino:</p>
            <button class="btn-proximo" data-proximo="1">Investigar as catacumbas sob o Pátio do Colégio.</button>
            <button class="btn-proximo" data-proximo="2">Explorar as galerias subterrâneas do Vale do Anhangabaú.</button>
        </div>
        <div class="passo" id="passo-1">
            <p>O Desafio dos Rios Ocultos.Confrontando a geografia da cidade</p>
            <button class="btn-proximo" data-proximo="3">Você descobre uma porta de ferro atrás das fundações. Ela leva a um túnel flooded pelo antigo Rio Tamanduateí. Para atravessar, você deve decifrar um enigma entalhado na pedra sobre o leito original do rio.</button>
            <button class="btn-proximo" data-proximo="4">Você desce pelas galerias pluviométricas e encontra marcas nas paredes deixadas por bandeirantes no século XVII, indicando a entrada de uma caverna oculta sob o Viaduto do Chá.</button>
        </div>
